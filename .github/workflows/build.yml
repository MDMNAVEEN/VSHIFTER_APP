
name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check Java Version
        run: java -version

      - name: Install Cordova
        run: npm install -g cordova

      - name: Check Repository Structure
        run: |
          echo "Repository root:"
          pwd
          ls -la
          echo "Searching for UI5 files:"
          find . -type f \( -name "index.html" -o -name "Component.js" -o -name "manifest.json" \)

      - name: Create Cordova project
        run: |
          cordova create app com.mdm.vshifter VSHIFTER_APP
          echo "Cordova project created"

      - name: Verify Webapp Files
        run: |
          echo "Checking Cordova www folder"
          ls -la app/www/
          test -f app/www/index.html
          test -f app/www/Component.js
          test -f app/www/manifest.json

      - name: Add Android platform
        working-directory: app
        run: cordova platform add android

      - name: Build APK
        working-directory: app
        run: cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VSHIFTER-APK
          path: app/platforms/android/app/build/outputs/apk/debug/*.apk
